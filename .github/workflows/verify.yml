name: 比對搜尋結果

# 兩種觸發方式，做同一件事：
#   1. workflow_dispatch —— 在 Actions 分頁手動貼網址、按 Run workflow。
#      GitHub 本身就只允許有 repo 寫入權限的人觸發這個，不用再另外檢查。
#   2. issues（opened／edited）—— 用 .github/ISSUE_TEMPLATE/
#      verify-request.yml 開一個 issue，貼網址進去。這個是公開 repo，
#      任何登入的人都能開 issue，所以底下用 job 層級的 if 限定「開 issue
#      的人是 repo owner」＋「issue 有 verify-request 標籤」兩個條件都要
#      成立才會真的跑——否則任何人都能對這個 repo 的 Actions 額度搞事。
#
#      刻意不含 labeled：用表單開 issue 時，GitHub 會在建立當下就把
#      verify-request 標籤帶上，opened 事件本身就已經看得到這個標籤，
#      不需要另外監聽 labeled。2026-09-23 實測過會含 labeled 的版本：
#      用 API 帶標籤建立 issue 會讓 opened／labeled 幾乎同時各發一次事件，
#      兩次執行都各自 checkout 到事件觸發當下釘住的舊 commit（見下面
#      checkout 那步的註解），第二次 push 時才發現落後，被拒絕。
#      拿掉 labeled 讓這個重複觸發的路徑不會再發生。
#
# 抓取的目標網域已經被 extract.js／verify.js 鎖死在 eeas／consilium／
# nato.int 三站（見 sites.json），不管輸入是誰貼的，能被拿去 fetch 的
# 網址範圍不會超出這三個站。

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '網址清單（一行一個，或整段貼上也可以）'
        required: true
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: eu-verify-report
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        contains(github.event.issue.labels.*.name, 'verify-request')
      )
    runs-on: ubuntu-latest
    steps:
      # 明確指定 ref: main，不要用 actions/checkout 的預設行為。
      # 預設會 checkout 觸發事件當下釘住的那個 commit，不是執行當下 main
      # 的最新狀態。當兩個事件在短時間內先後觸發（2026-09-23 實測過），
      # 兩次執行各自 checkout 到同一個舊 commit，先跑完的那次能正常
      # push，後跑完的那次因為本地分支落後於遠端而被拒絕。
      # 指定 ref: main 讓每次執行都從「真正執行當下」的 main 開始，
      # 而不是從「事件觸發當下」的 main 開始——配上上面的 concurrency
      # 群組（讓執行序列化，不會真的同時跑），這樣後面排隊的那次執行
      # 就能看到前一次已經 push 的內容。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 這兩個值可能含有使用者貼的任意文字（issue 內文）。
      # 一律經由 env 傳遞，不要直接內插進 run: 的腳本字串裡——
      # 那樣做的話，issue 內文只要含有一個反引號或分號，就能在這個
      # runner 上跑任意指令。這不是理論風險，是 GitHub Actions 最常見
      # 的注入手法之一。
      - name: 準備輸入
        env:
          DISPATCH_URLS: ${{ github.event.inputs.urls }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$DISPATCH_URLS" > raw-input.txt
          else
            printf '%s' "$ISSUE_BODY" > raw-input.txt
          fi

      - name: 抽取目標站網址
        id: extract
        run: |
          set +e
          node extract.js --text raw-input.txt > extracted-urls.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # 抓到 0 筆是錯誤，不是「今天沒有新東西」——理由跟本機版、網頁版
      # 完全一樣，見 README「抓到 0 筆時會停下來，不會裝作沒事」。
      - name: 沒抓到網址就通知並停止
        if: steps.extract.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body \
              $'⚠ 沒有在這則 issue 裡找到任何目標站（eeas／consilium／nato）的網址，沒有執行比對。\n\n這不代表「沒有新東西」，只代表這次沒讀到網址——請確認貼的內容裡真的有結果連結。'
          fi
          echo "::error::沒有抓到任何目標站網址，中止。"
          exit 1

      # extracted-urls.txt 裡除了網址，還有 extract.js 原樣傳下來的 #euv 收集紀錄行，
      # verify.js 會讀它來判斷每一站有沒有收完所有頁。
      - name: 執行比對
        run: node verify.js extracted-urls.txt -o latest-report.html --summary-json summary.json

      - name: 認可報告
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-report.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update latest-report.html"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 留言回報
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIRMED=$(node -p "require('./summary.json').confirmed")
          ABSENT=$(node -p "require('./summary.json').absent")
          CHROME=$(node -p "require('./summary.json').chrome")
          UNKNOWN=$(node -p "require('./summary.json').unknown")
          NEEDLOOK=$(node -p "var s=require('./summary.json'); (s.absent + s.unknown) ? '找不到關鍵字與無法檢查的那 ' + (s.absent + s.unknown) + ' 筆要自己看，不代表沒有命中。' : ''")
          # 收集狀況的文字有一部分來自 issue 內文裡的 #euv 紀錄行。這裡只做變數展開，
          # 展開後的值不會被 shell 再解析一次，所以內容裡就算有 $() 也不會被執行。
          COVERAGE=$(node -p "require('./summary.json').coverage.map(function(l){return '- '+l}).join('\n')")
          INCOMPLETE=$(node -p "require('./summary.json').incomplete ? '**⚠ 收集不完整**——下面的數字只涵蓋已收到的網址，沒收到的頁面不在任何一類裡。' : ''")
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<BODY
          ${INCOMPLETE}

          收集狀況：
          ${COVERAGE}

          正文確認 ${CONFIRMED}　找不到關鍵字 ${ABSENT}　無法檢查 ${UNKNOWN}　只在導覽列 ${CHROME}
          ${NEEDLOOK}

          完整報告：https://liucheweiwill-dev.github.io/eu_verify/latest-report.html

          （這個連結永遠指向最新一次結果。找舊紀錄：https://github.com/liucheweiwill-dev/eu_verify/commits/main/latest-report.html）
          BODY
          )"
