<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>eu_verify — 網頁版</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f6f7f9; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ea;
    --accent:#1f5fd0; --accent-ink:#fff; --code:#f3f4f6;
    --ok:#1a7f43; --warn:#8a6d1f; --dim:#6b7280; --chip:#eef2f9; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#14161a; --card:#1c1f25; --ink:#e8eaed; --muted:#9aa2ad; --line:#2b2f37;
    --accent:#6c9bf0; --accent-ink:#10131a; --code:#22262e;
    --ok:#5fcf8e; --warn:#e2c078; --dim:#9aa2ad; --chip:#242832; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 56px; background:var(--bg); color:var(--ink);
    font:15px/1.6 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .depend { font-size:12.5px; color:var(--warn); margin:0 0 20px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px; margin-bottom:16px; }
  textarea { width:100%; min-height:120px; resize:vertical;
    background:var(--code); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font:13px/1.5 ui-monospace,Consolas,monospace; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  button { appearance:none; border:0; border-radius:9px; font:inherit; font-weight:700;
    padding:10px 18px; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); font-size:15px; }
  button.ghost { background:var(--chip); color:var(--ink); font-size:13.5px; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-size:13.5px; color:var(--muted); margin-top:10px; min-height:1.4em; }
  .progress { font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--muted);
    margin-top:6px; white-space:pre-wrap; max-height:140px; overflow-y:auto; }
  .tally { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
  .tally div { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; font-size:13.5px; }
  .tally b { font-size:18px; display:block; }
  section { margin-bottom:22px; }
  h2 { font-size:15px; margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  h2 .n { color:var(--muted); font-weight:400; }
  section.ok h2 { color:var(--ok); }
  section.chrome h2 { color:var(--dim); }
  section.unknown h2 { color:var(--warn); }
  article { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:9px; }
  article a { color:var(--accent); text-decoration:none; font-weight:600; }
  article a:hover { text-decoration:underline; }
  .u { color:var(--muted); font-size:11.5px; word-break:break-all; margin-top:3px;
    font-family:ui-monospace,Consolas,monospace; }
  .kw { margin-top:8px; }
  .kw.sub { font-size:12px; color:var(--muted); }
  .chip { display:inline-block; background:var(--chip); border-radius:6px;
    padding:2px 7px; margin:2px 3px 2px 0; font-size:12px; }
  .chip.hit b { color:var(--ok); }
  .chip.dim { opacity:.65; }
  .chip i { color:var(--muted); font-style:normal; font-size:11px; }
  .why { color:var(--warn); font-size:13px; margin-top:6px; }
  footer { color:var(--muted); font-size:12.5px; margin-top:22px;
    border-top:1px solid var(--line); padding-top:14px; }
  footer b { color:var(--ink); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <h1>eu_verify — 網頁版</h1>
  <p class="sub">貼上 Google 結果的網址，檢查關鍵字是真的在正文裡，還是只在導覽列裡。</p>
  <p class="depend">⚠ 抓取經由第三方服務 <a href="https://r.jina.ai" target="_blank" rel="noopener noreferrer">r.jina.ai</a>（Jina AI Reader）中轉——
    這代表你查的網址會被那個服務看到。不想經過第三方的話，改用本機的 <code>run.cmd</code>（見 README）。</p>

  <div class="panel">
    <label for="input" style="font-size:12.5px;color:var(--muted);font-weight:600;">
      網址清單（書籤複製的內容直接貼上即可，一行或混在一段文字裡都可以）
    </label>
    <textarea id="input" spellcheck="false" placeholder="https://www.eeas.europa.eu/...&#10;https://www.nato.int/..."></textarea>
    <div class="row">
      <button class="ghost" id="paste" type="button">從剪貼簿貼上</button>
      <button class="primary" id="run" type="button">開始比對</button>
      <button class="ghost" id="clear" type="button">清空</button>
    </div>
    <div class="status" id="status"></div>
    <div class="progress" id="progress" hidden></div>
  </div>

  <div id="tally" class="tally" hidden></div>
  <div id="results"></div>

  <footer id="footer" hidden>
    <b>判讀提醒：</b>「只在導覽列」代表該頁的關鍵字命中數沒有超過同站基準線頁的命中數，
    也就是那些字很可能只出現在全站共用的選單裡。這是<b>精確度</b>工具——
    它只能從 Google 給的清單裡剔除假命中，<b>不會、也不可能告訴你有沒有漏掉什麼</b>。
    <span id="unknownNote"></span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 設定

  var JINA_PROXY = 'https://r.jina.ai/';
  var TARGETS = [];          // 從 sites.json 載入後填入 domain 清單
  var SITES = [];            // 從 sites.json 載入
  var BASELINE_PROBE = '';   // 從 sites.json 載入
  var REQUEST_DELAY_MS = 400; // 每次 fetch 之間的禮貌延遲（對 Jina，不是對目標站）

  var els = {
    input: document.getElementById('input'),
    paste: document.getElementById('paste'),
    run: document.getElementById('run'),
    clear: document.getElementById('clear'),
    status: document.getElementById('status'),
    progress: document.getElementById('progress'),
    tally: document.getElementById('tally'),
    results: document.getElementById('results'),
    footer: document.getElementById('footer'),
    unknownNote: document.getElementById('unknownNote'),
  };

  // ---------------------------------------------------------------- 小工具

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function htmlToText(html) {
    return html
      .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
      .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
      .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
      .replace(/\s+/g, ' ')
      .trim();
  }

  function extractTitle(html) {
    var m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    return m ? htmlToText(m[1]).slice(0, 160) : '';
  }

  function countKeyword(text, kw) {
    var re = new RegExp(escapeRegExp(kw), 'gi');
    var m = text.match(re);
    return m ? m.length : 0;
  }

  function parseKeywords(kwString) {
    return kwString.split(';').map(function (k) { return k.trim(); })
      .filter(function (k) { return k.length > 0; });
  }

  function siteFor(host) {
    for (var i = 0; i < SITES.length; i++) {
      var d = SITES[i].domain;
      if (host === d || host.slice(-(d.length + 1)) === '.' + d) return SITES[i];
    }
    return null;
  }

  // 從一段文字（乾淨的網址清單，或整段貼上的雜訊）挑出目標站網址。
  // 邏輯跟 extract.js 一致：解開 Google 的 /url?q=、去掉 Google 自己的
  // 連結、去 hash／utm、去重。
  function harvest(text) {
    var found = [];
    var re = /https?:\/\/[^\s"'<>\\)\]]+/gi;
    var m;
    while ((m = re.exec(text)) !== null) {
      var cleaned = m[0].replace(/[.,;:!?]+$/, '');
      var n = normalise(cleaned);
      if (n) found.push(n);
    }
    var seen = {}, out = [];
    found.forEach(function (u) { if (!seen[u]) { seen[u] = 1; out.push(u); } });
    return out;
  }

  function normalise(raw) {
    var u = unwrapGoogle(raw.trim());
    try {
      var parsed = new URL(u);
      if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return null;
      if (!siteFor(parsed.hostname)) return null;
      parsed.hash = '';
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content']
        .forEach(function (p) { parsed.searchParams.delete(p); });
      return parsed.toString();
    } catch (e) { return null; }
  }

  function unwrapGoogle(u) {
    try {
      var parsed = new URL(u);
      if (/(^|\.)google\./.test(parsed.hostname) && parsed.pathname === '/url') {
        var inner = parsed.searchParams.get('q') || parsed.searchParams.get('url');
        if (inner) return inner;
      }
    } catch (e) { /* 不是合法網址，原樣放回去交給外層判斷 */ }
    return u;
  }

  // ---------------------------------------------------------------- 抓取（經 Jina）

  function fetchViaJina(url) {
    return fetch(JINA_PROXY + url, {
      cache: 'no-store',
      headers: { 'X-Return-Format': 'html' },
    }).then(function (res) {
      return res.text().then(function (body) {
        return { ok: true, status: res.status, body: body };
      });
    }).catch(function (e) {
      return { ok: false, error: '無法連上 r.jina.ai：' + (e && e.message || e) };
    });
  }

  var baselineCache = {};

  function getBaseline(host) {
    if (baselineCache[host]) return baselineCache[host];
    var p = fetchViaJina('https://' + host + BASELINE_PROBE).then(function (res) {
      if (!res.ok) return { available: false, reason: res.error };
      if (res.status !== 200) {
        return { available: false, reason: 'Jina 回應非 200：HTTP ' + res.status };
      }
      var text = htmlToText(res.body);
      var counts = {};
      SITES.forEach(function (s) {
        parseKeywords(s.kw).forEach(function (kw) { counts[kw] = countKeyword(text, kw); });
      });
      return { available: true, counts: counts };
    });
    baselineCache[host] = p;
    return p;
  }

  async function checkUrl(rawUrl) {
    var out = { url: rawUrl };
    var host;
    try { host = new URL(rawUrl).hostname; }
    catch (e) { out.state = 'unknown'; out.reason = '不是合法的網址'; return out; }
    out.host = host;

    var site = siteFor(host);
    if (!site) { out.state = 'unknown'; out.reason = '這個 host 不在設定裡'; return out; }
    out.domain = site.domain;

    if (site.knownBlocked) { out.state = 'unknown'; out.reason = site.knownBlocked; return out; }

    var keywords = parseKeywords(site.kw);
    var baseline = await getBaseline(host);
    out.baseline = baseline;
    if (!baseline.available) { out.state = 'unknown'; out.reason = '抓不到基準線：' + baseline.reason; return out; }

    await sleep(REQUEST_DELAY_MS);
    var res = await fetchViaJina(rawUrl);
    if (!res.ok) { out.state = 'unknown'; out.reason = res.error; return out; }
    if (res.status >= 400) { out.state = 'unknown'; out.reason = '抓取失敗：HTTP ' + res.status; return out; }

    out.title = extractTitle(res.body);
    var text = htmlToText(res.body);
    out.hits = []; out.chromeOnly = []; out.absent = [];
    keywords.forEach(function (kw) {
      var c = countKeyword(text, kw);
      var b = baseline.counts[kw] || 0;
      if (c === 0) out.absent.push(kw);
      else if (c > b) out.hits.push({ kw: kw, count: c, baseline: b });
      else out.chromeOnly.push({ kw: kw, count: c, baseline: b });
    });
    out.state = out.hits.length > 0 ? 'confirmed' : 'chrome';
    return out;
  }

  // ---------------------------------------------------------------- 畫面

  function linkOf(r) {
    var href = escapeHtml(r.url);
    var label = escapeHtml(r.title || r.url);
    return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label +
      '</a><div class="u">' + escapeHtml(r.url) + '</div>';
  }

  function kwChips(list, cls) {
    return list.map(function (h) {
      return '<span class="chip ' + cls + '">' + escapeHtml(h.kw) +
        ' <b>' + h.count + '</b><i>／基準線 ' + h.baseline + '</i></span>';
    }).join(' ');
  }

  function render(results) {
    var confirmed = results.filter(function (r) { return r.state === 'confirmed'; });
    var chrome = results.filter(function (r) { return r.state === 'chrome'; });
    var unknown = results.filter(function (r) { return r.state === 'unknown'; });

    els.tally.hidden = false;
    els.tally.innerHTML =
      '<div><b>' + confirmed.length + '</b>正文確認</div>' +
      '<div><b>' + chrome.length + '</b>只在導覽列</div>' +
      '<div><b>' + unknown.length + '</b>無法檢查</div>';

    function section(title, cls, rows, bodyFn) {
      if (rows.length === 0) return '';
      return '<section class="' + cls + '"><h2>' + escapeHtml(title) +
        ' <span class="n">' + rows.length + '</span></h2>' +
        rows.map(bodyFn).join('') + '</section>';
    }

    els.results.innerHTML =
      section('正文確認命中', 'ok', confirmed, function (r) {
        return '<article>' + linkOf(r) + '<div class="kw">' + kwChips(r.hits, 'hit') + '</div>' +
          (r.chromeOnly.length ? '<div class="kw sub">另有只在導覽列的：' + kwChips(r.chromeOnly, 'dim') + '</div>' : '') +
          '</article>';
      }) +
      section('只在導覽列命中（Google 誤判）', 'chrome', chrome, function (r) {
        return '<article>' + linkOf(r) + '<div class="kw">' + kwChips(r.chromeOnly, 'dim') + '</div></article>';
      }) +
      section('無法檢查', 'unknown', unknown, function (r) {
        return '<article>' + linkOf(r) + '<div class="why">' + escapeHtml(r.reason || '') + '</div></article>';
      });

    els.footer.hidden = false;
    els.unknownNote.textContent = unknown.length
      ? '本次有 ' + unknown.length + ' 筆無法檢查，那幾筆既不是命中也不是未命中，請自己開來看。'
      : '';
  }

  // ---------------------------------------------------------------- 主流程

  async function loadSites() {
    var res = await fetch('./sites.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('讀不到 sites.json（HTTP ' + res.status + '）');
    var cfg = await res.json();
    SITES = cfg.sites;
    BASELINE_PROBE = cfg.baselineProbePath;
  }

  async function run() {
    els.run.disabled = true;
    els.results.innerHTML = '';
    els.tally.hidden = true;
    els.footer.hidden = true;
    els.progress.hidden = false;
    els.progress.textContent = '';
    baselineCache = {};

    try {
      if (SITES.length === 0) await loadSites();
    } catch (e) {
      els.status.textContent = '⚠ 設定檔載入失敗：' + e.message;
      els.run.disabled = false;
      return;
    }

    var urls = harvest(els.input.value);
    if (urls.length === 0) {
      els.status.textContent = '⚠ 沒有找到任何目標站網址。這不代表「今天沒有新東西」，只代表這次沒讀到網址——請確認貼的內容裡真的有 eeas／consilium／nato 的結果連結。';
      els.progress.hidden = true;
      els.run.disabled = false;
      return;
    }

    els.status.textContent = '找到 ' + urls.length + ' 筆，開始檢查…';
    var results = [];
    for (var i = 0; i < urls.length; i++) {
      var line = '[' + (i + 1) + '/' + urls.length + '] ' + urls[i].slice(0, 74);
      els.progress.textContent += line + ' …\n';
      els.progress.scrollTop = els.progress.scrollHeight;
      var r = await checkUrl(urls[i]);
      results.push(r);
      var mark = r.state === 'confirmed' ? '正文命中'
        : r.state === 'chrome' ? '只在導覽列'
        : '無法檢查 — ' + r.reason;
      els.progress.textContent += '    → ' + mark + '\n';
      els.progress.scrollTop = els.progress.scrollHeight;
      render(results); // 逐筆更新畫面，不用等全部跑完
    }

    els.status.textContent = '完成。共 ' + urls.length + ' 筆。';
    els.run.disabled = false;
  }

  // ---------------------------------------------------------------- 事件

  els.paste.addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      els.status.textContent = '這個瀏覽器不支援自動讀取剪貼簿，請手動貼上（Ctrl+V）。';
      return;
    }
    navigator.clipboard.readText().then(function (text) {
      els.input.value = text;
      els.status.textContent = '已從剪貼簿貼上。';
    }, function () {
      els.status.textContent = '讀取剪貼簿被拒絕，請手動貼上（Ctrl+V）。';
    });
  });

  els.clear.addEventListener('click', function () {
    els.input.value = '';
    els.results.innerHTML = '';
    els.tally.hidden = true;
    els.footer.hidden = true;
    els.progress.hidden = true;
    els.status.textContent = '';
  });

  els.run.addEventListener('click', run);

  loadSites().catch(function (e) {
    els.status.textContent = '⚠ 設定檔載入失敗：' + e.message;
  });
})();
</script>
</body>
</html>
